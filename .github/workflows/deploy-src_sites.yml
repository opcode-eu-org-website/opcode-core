name: Deploy Sources Sites

on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: 'Select deploy mode / target'
        required: true
        type: choice
        options:
          - opcode # https://src-opcode.pages.dev/
          - dragons-labs # https://src-dragons-labs.pages.dev/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment directory
        run: |
          rm -fr src_site
          ./tools/create_src_site.py ${{ inputs.deploy_mode }} src_site
          cp lib/index.css src_site
          
          # remove symlink from /current ... pages deploy has problem with broken links
          (cd src_site; find -type l -regex './[^/]*/current/.*' -exec rm -f {} \;)

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy src_site --branch=main --project-name=src-${{ inputs.deploy_mode }}
